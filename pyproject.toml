[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "status-brew"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["jinja2>=3.1"]

[project.scripts]
status-brew = "status_brew.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
